<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet PULSAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen stage. A heartbeat trace draws across the dark, its spike blooms into
   the mascot, then the name assembles and spells out its acronym. Single dark look, by choice. */
:root {
  --space: #050e2f;      /* sampled from the mascot render's backdrop */
  --space-lift: #0d1a44;
  --pulse: #5ef2ec;      /* visor face / ECG cyan */
  --orbit: #9a8cff;      /* orbit-ring violet */
  --shell: #eef1fb;      /* mascot shell white */
  --muted: #8f9ccc;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse 70% 60% at 50% 38%, var(--space-lift), var(--space) 70%) var(--space);
  color: var(--shell);
  font-family: var(--f-body);
  overflow: hidden;
}
#stars { position: fixed; inset: 0; width: 100%; height: 100%; }

.stage {
  position: relative; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(4px, 1.2vh, 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  text-align: center;
}

/* ---------- heartbeat trace ---------- */
.ecg {
  position: absolute; left: 0; right: 0; top: 34%; height: 18vh; width: 100%;
  overflow: visible; pointer-events: none;
}
.ecg path {
  fill: none; stroke: var(--pulse); stroke-width: 2.5; vector-effect: non-scaling-stroke;
  stroke-linejoin: round; stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--pulse)) drop-shadow(0 0 18px rgba(94, 242, 236, .5));
  stroke-dasharray: 1; stroke-dashoffset: 0;
}
.bloom {
  position: absolute; left: 50%; top: calc(34% + 9vh); width: 40px; height: 40px;
  margin: -20px 0 0 -20px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0, var(--pulse) 30%, rgba(94, 242, 236, 0) 70%);
  opacity: 0; pointer-events: none;
}

/* ---------- mascot ---------- */
.hero { position: relative; width: min(64vh, 78vw); aspect-ratio: 3 / 2; max-width: 100%; flex: none; }
.ripple {
  position: absolute; left: 50%; top: 44%; width: 46%; aspect-ratio: 1; translate: -50% -50%;
  border-radius: 50%; border: 2px solid var(--orbit); opacity: 0; pointer-events: none;
}
.mascot {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  -webkit-mask-image: radial-gradient(ellipse 52% 62% at 51% 46%, #000 62%, transparent 92%);
          mask-image: radial-gradient(ellipse 52% 62% at 51% 46%, #000 62%, transparent 92%);
}

/* ---------- name ---------- */
.eyebrow {
  font-family: var(--f-mono); font-size: clamp(11px, 1.6vh, 15px); letter-spacing: .32em;
  text-transform: uppercase; color: var(--muted);
}
.name {
  margin: 0; font-family: var(--f-display); font-weight: 700; line-height: 1;
  font-size: clamp(34px, 9.5vh, 112px); letter-spacing: .02em;
  display: flex; flex-wrap: wrap; justify-content: center;
}
.name .l { display: inline-block; }
.name .dot { color: var(--pulse); text-shadow: 0 0 18px rgba(94, 242, 236, .7); }
.acronym {
  margin: 0; max-width: 60ch; font-family: var(--f-body); font-weight: 400;
  font-size: clamp(14px, 2.3vh, 22px); color: var(--muted); text-wrap: balance;
}
.acronym .w { display: inline-block; }
.acronym b { font-weight: 600; color: var(--pulse); }
.tagline {
  margin: clamp(6px, 1.4vh, 16px) 0 0; font-family: var(--f-display); font-weight: 300;
  font-size: clamp(16px, 3vh, 30px); text-wrap: balance;
}
.tagline em { font-style: normal; font-weight: 500; color: var(--pulse); }
.foot {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px;
  margin-top: clamp(8px, 2vh, 22px);
  font-family: var(--f-mono); font-size: clamp(10px, 1.4vh, 13px); letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.foot span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--orbit); margin-right: 8px; vertical-align: middle; }

/* ---------- controls ---------- */
.controls {
  position: fixed; z-index: 2;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; opacity: .55; transition: opacity .2s;
}
.controls:hover, .controls:focus-within { opacity: 1; }
.controls button {
  font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--shell); background: rgba(13, 26, 68, .7); border: 1px solid rgba(154, 140, 255, .45);
  border-radius: 999px; padding: 9px 14px; cursor: pointer;
}
.controls button:hover { border-color: var(--pulse); }
.controls button:focus-visible { outline: 2px solid var(--pulse); outline-offset: 2px; }

/* ---------- the sequence (≈ 9 s), runs when .play is on the stage ---------- */
.play .ecg path   { animation: draw 1.7s cubic-bezier(.5, 0, .3, 1) both, fadeOut .5s 1.9s both; }
.play .bloom      { animation: bloom 1.1s 1.15s ease-out both; }
.play .hero       { animation: rise 1.3s 1.6s cubic-bezier(.2, .9, .25, 1.15) both; }
.play .mascot     { animation: float 4.6s 2.9s ease-in-out infinite; }
.play .ripple     { animation: ripple 2.4s ease-out infinite; }
.play .ripple.r1  { animation-delay: 2.4s; }
.play .ripple.r2  { animation-delay: 3.2s; }
.play .ripple.r3  { animation-delay: 4.0s; }
.play .eyebrow    { animation: fadeUp .7s 2.9s both; }
.play .name .l    { animation: drop .6s cubic-bezier(.2, .9, .3, 1.3) both; animation-delay: calc(3.2s + var(--i) * 90ms); }
.play .acronym .w { animation: fadeUp .6s both; animation-delay: calc(4.6s + var(--i) * 220ms); }
.play .tagline    { animation: fadeUp .9s 6.6s both; }
.play .foot       { animation: fadeUp .9s 7.4s both; }

@keyframes draw    { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes bloom   { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(14); } }
@keyframes rise    { from { opacity: 0; transform: translateY(6vh) scale(.6); filter: blur(10px); }
                     to   { opacity: 1; transform: none; filter: none; } }
@keyframes float   { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2.2%) rotate(-1.2deg); } }
@keyframes ripple  { 0% { opacity: .7; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes drop    { from { opacity: 0; transform: translateY(-40%) scale(1.4); filter: blur(6px); }
                     to   { opacity: 1; transform: none; filter: none; } }

/* Static, complete frame for viewers who ask for less motion (and the end state of the sequence). */
@media (prefers-reduced-motion: reduce) {
  .play * { animation: none !important; }
  .ecg, .bloom { display: none; }
}
@media (max-height: 520px) { .foot { display: none; } }
</style>

    <span class="w" style="--i:3"><b>S</b>upport,</span>
    <span class="w" style="--i:4"><b>A</b>ssistance &amp;</span>
    <span class="w" style="--i:5"><b>R</b>eminders</span>
  </p>
  <p class="tagline">Your personal <em>health companion</em> in space.</p>
  <div class="foot"><span>Runs on one laptop, fully offline</span><span>NASA Space Apps 2026</span></div>
</main>

<div class="controls">
  <button type="button" id="replay" title="Replay (R or Space)">Replay</button>
  <button type="button" id="full" title="Fullscreen (F)">Fullscreen</button>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const replay = () => { stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play'); };
  const fullscreen = () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* not available in this view */ }
  };
  document.getElementById('replay').addEventListener('click', replay);
  document.getElementById('full').addEventListener('click', fullscreen);
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.key === 'r' || e.key === 'R' || e.key === ' ') { e.preventDefault(); replay(); }
    if (e.key === 'f' || e.key === 'F') fullscreen();
  });

  // Starfield: slow drift, a few stars twinkle. Static when reduced motion is requested.
  const cv = document.getElementById('stars'), cx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], w = 0, h = 0, dpr = 1;
  const seed = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    const n = Math.round((innerWidth * innerHeight) / 5200);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.1 + .25) * dpr,
      v: (Math.random() * .12 + .02) * dpr, t: Math.random() * 6.28, tw: Math.random() < .25,
    }));
  };
  const frame = (time) => {
    cx.clearRect(0, 0, w, h);
    for (const s of stars) {
      if (!still) { s.x -= s.v; if (s.x < 0) s.x = w; }
      const a = s.tw ? .35 + .65 * Math.abs(Math.sin(s.t + time / 900)) : .6;
      cx.globalAlpha = a; cx.fillStyle = '#dfe6ff';
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  };
  seed(); addEventListener('resize', () => { seed(); if (still) frame(0); });
  still ? frame(0) : requestAnimationFrame(frame);
})();
</script>
</body>
</html>
